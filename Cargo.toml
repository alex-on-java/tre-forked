[package]
name = "tre-command"
version = "0.4.1"
authors = ["Daniel Duan <daniel@duan.ca>"]
edition = "2021"
license = "MIT"
description = "Tree command, improved."
documentation = "https://github.com/dduan/tre/blob/master/README.md"
readme = "README.md"
homepage = "https://github.com/dduan/tre"
repository = "https://github.com/dduan/tre"
exclude = ["/.github/*", "alias_demo.gif", "flake.nix", "flake.lock", "scripts/*", "fixtures/*"]
keywords = ["cli", "tool", "filesystem"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2"
lscolors = "0.21"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
termcolor = "1"
walkdir = "2"
ordered-float = "4"

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3"

[[bin]]
name = "tre"
path = "src/main.rs"
